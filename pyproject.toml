[project]
name = "reorder-line"
version = "0.2.0"
description = "Voice reorder agent for a Bangladeshi garments wholesaler (Python/FastAPI)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# SQLModel's dynamic table metaclass trips strict mypy; relax just the models module.
module = "app.models"
disallow_untyped_defs = false
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
